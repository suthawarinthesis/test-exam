<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POSN Exam Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--ink:#173238;--teal:#006C64;--mint:#E7F1EF;--orange:#F26632;--line:#DCE7E4;--muted:#667875}*{box-sizing:border-box}body{margin:0;background:#f5faf8;color:var(--ink);font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.hero{grid-column:span 12;background:var(--ink);color:white}.login{grid-column:span 4}.data{grid-column:span 8}.full{grid-column:span 12}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px}button{border:0;border-radius:12px;padding:11px 14px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--mint);color:var(--teal);font-size:12px}.review{padding:10px;border:1px solid #fed7aa;background:#fff7ed;border-radius:12px;margin:8px 0}@media(max-width:800px){.login,.data{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="grid"><div class="card hero"><h1>POSN Biology • Admin Dashboard</h1><p>ดูผลสอบย้อนหลัง เปิดรายละเอียดรายคน และตรวจคิวเฉลยที่ตั้ง flag ไว้</p></div><div class="card login"><h3>Admin sign in</h3><input id="email" placeholder="email"><input id="password" type="password" placeholder="password"><button id="login">เข้าสู่ระบบ</button><p class="muted" id="auth"></p></div><div class="card data"><h3>ภาพรวม</h3><div id="summary" class="muted">เข้าสู่ระบบเพื่อโหลดข้อมูล</div></div><div class="card full"><h3>Attempts</h3><div style="overflow:auto"><table><thead><tr><th>ชื่อ</th><th>เริ่ม</th><th>สถานะ</th><th>คะแนน</th><th>Tab</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card full"><h3>Answer-key review queue</h3><div id="keyQueue" class="muted">—</div></div><div class="card full"><h3>Attempt detail</h3><div id="detail" class="muted">คลิก “ดู” ที่รายการด้านบน</div></div></div></div><script>const c=window.EXAM_CONFIG,sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY),$=s=>document.querySelector(s);$('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#auth').textContent=error?error.message:'เข้าสู่ระบบแล้ว';if(!error)load()};async function load(){const {data,error}=await sb.rpc('admin_list_attempts',{p_limit:300});if(error){$('#summary').textContent=error.message;return}const done=data.filter(x=>x.score!=null),avg=done.length?done.reduce((a,x)=>a+(x.score/(x.total_questions||104)*100),0)/done.length:0;$('#summary').innerHTML=`<b>${data.length}</b> attempts • เฉลี่ย <b>${avg.toFixed(1)}%</b> • ส่งแล้ว <b>${done.length}</b>`;$('#rows').innerHTML=data.map(x=>`<tr><td>${esc(x.student_name)}</td><td>${new Date(x.started_at).toLocaleString('th-TH')}</td><td><span class="pill">${x.status}</span></td><td>${x.score==null?'—':x.score+'/'+x.total_questions}</td><td>${x.tab_switches}</td><td><button onclick="detail('${x.id}')">ดู</button></td></tr>`).join('');const k=await sb.rpc('admin_key_review_queue');$('#keyQueue').innerHTML=k.error?k.error.message:(k.data.length?k.data.map(x=>`<div class="review"><b>ข้อ ${x.source_label} → ${x.correct_option}</b><br>${esc(x.review_note||'')}</div>`).join(''):'ไม่มีรายการรอตรวจ')};window.detail=async id=>{const {data,error}=await sb.rpc('admin_attempt_detail',{p_attempt_id:id});if(error)return $('#detail').textContent=error.message;$('#detail').innerHTML=`<h2>${esc(data.student_name)} • ${data.score}/${data.total} (${data.percent}%)</h2>`+(data.topics||[]).sort((a,b)=>a.accuracy-b.accuracy).map(t=>`<p><b>${t.name}</b> ${t.correct}/${t.total} — ${t.accuracy}%</p>`).join('')};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
