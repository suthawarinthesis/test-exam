<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POSN Biology Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#173238;--teal:#006c64;--mint:#e7f1ef;--orange:#f26632;--line:#dce7e4;--paper:#f8fbfa;--muted:#6b7c79}*{box-sizing:border-box}body{margin:0;background:#f5f9f8;color:var(--ink);font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{width:min(1220px,calc(100% - 26px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-weight:900;font-size:20px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.login{grid-column:span 5}.help{grid-column:span 7}.full{grid-column:1/-1}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin:5px 0 10px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--orange);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--mint);font-size:11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:26px}.muted{color:var(--muted)}@media(max-width:780px){.login,.help{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">POSN Biology • Admin</div><a href="index.html">กลับหน้าสอบ</a></div><section id="loginView" class="grid"><div class="card login"><h2>เข้าสู่ระบบผู้ดูแล</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary">เข้าสู่ระบบ</button><p id="loginMsg" class="muted"></p></div><div class="card help"><h2>Admin only</h2><p class="muted">หน้านี้ไม่มีระบบสมัครสมาชิก ผู้ดูแลต้องสร้างบัญชีใน Supabase Authentication และเพิ่ม UUID เข้า <code>exam_admins</code> ก่อนใช้งาน</p></div></section><section id="dash" class="hidden"><div class="metrics"><div class="metric"><span>Attempts</span><b id="mAttempts">0</b></div><div class="metric"><span>Submitted</span><b id="mSubmitted">0</b></div><div class="metric"><span>Average</span><b id="mAvg">—</b></div><div class="metric"><span>In progress</span><b id="mLive">0</b></div></div><div class="card full"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>ผลการสอบ</h2><div><button id="refreshBtn" class="ghost">รีเฟรช</button> <button id="logoutBtn" class="ghost">ออกจากระบบ</button></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อ</th><th>เริ่ม</th><th>สถานะ</th><th>คะแนน</th><th>%</th><th>เปลี่ยนแท็บ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="detailCard" class="card full hidden" style="margin-top:13px"></div></section></div><script>
const sb=supabase.createClient("https://naekkdyprycrnbipraiv.supabase.co","sb_publishable_ORA6ah_DuauqZrW7Pf2p6w_EyIlKtuw");const $=s=>document.querySelector(s);function dt(x){return x?new Date(x).toLocaleString('th-TH'):'—'}async function login(){$('#loginMsg').textContent='กำลังเข้าสู่ระบบ…';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)return $('#loginMsg').textContent=error.message;await load()}$('#loginBtn').onclick=login;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#refreshBtn').onclick=load;
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data,error}=await sb.rpc('admin_list_attempts',{p_limit:500});if(error){$('#loginMsg').textContent='บัญชีนี้ยังไม่ได้รับสิทธิ์ admin';return}$('#loginView').classList.add('hidden');$('#dash').classList.remove('hidden');const arr=data||[];$('#mAttempts').textContent=arr.length;$('#mSubmitted').textContent=arr.filter(x=>x.status!=='in_progress').length;$('#mLive').textContent=arr.filter(x=>x.status==='in_progress').length;const scored=arr.filter(x=>Number.isFinite(x.score)&&x.total_questions);$('#mAvg').textContent=scored.length?(scored.reduce((s,x)=>s+x.score/x.total_questions*100,0)/scored.length).toFixed(1)+'%':'—';$('#rows').innerHTML=arr.map(x=>`<tr><td><strong>${escapeHtml(x.student_name)}</strong></td><td>${dt(x.started_at)}</td><td><span class="badge">${x.status}</span></td><td>${x.score==null?'—':x.score+'/'+x.total_questions}</td><td>${x.score==null?'—':(x.score/x.total_questions*100).toFixed(1)+'%'}</td><td>${x.tab_switches}</td><td><button class="ghost detail" data-id="${x.id}">ดู</button></td></tr>`).join('');document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function detail(id){const {data,error}=await sb.rpc('admin_attempt_detail',{p_attempt_id:id});if(error)return alert(error.message);const r=data;const d=$('#detailCard');d.classList.remove('hidden');d.innerHTML=`<h2>${escapeHtml(r.student_name)} — ${r.score??'—'}/${r.total??'—'}</h2><p class="muted">ใช้เวลา ${Math.round((r.time_used_seconds||0)/60)} นาที • ไม่ตอบ ${r.unanswered} ข้อ • เปลี่ยนแท็บ ${r.tab_switches} ครั้ง</p><div>${(r.topics||[]).map(t=>`<p><strong>${t.name}</strong> — ${t.accuracy}% (${t.correct}/${t.total})</p>`).join('')}</div>`;d.scrollIntoView({behavior:'smooth'})}load();</script></body></html>
